name: tests-and-package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests experiments
      - run: python -m pytest -q
      - run: python -m build
      - name: Test installed wheel outside checkout
        shell: python
        run: |
          import pathlib, subprocess, sys, tempfile, venv
          wheel = next(pathlib.Path('dist').glob('*.whl')).resolve()
          with tempfile.TemporaryDirectory() as tmp:
              root = pathlib.Path(tmp)
              venv.create(root / 'env', with_pip=True)
              py = root / 'env' / ('Scripts/python.exe' if sys.platform == 'win32' else 'bin/python')
              cli = py.parent / ('prismbench.exe' if sys.platform == 'win32' else 'prismbench')
              subprocess.run([str(py), '-m', 'pip', 'install', str(wheel)], check=True)
              subprocess.run([str(py), '-m', 'pip', 'check'], check=True)
              subprocess.run([str(cli), '--version'], cwd=root, check=True)
              subprocess.run([str(cli), 'demo', '--output', str(root / 'demo')], cwd=root, check=True)
              subprocess.run([str(cli), 'report', str(root / 'demo/results.json'), '--output', str(root / 'export')], cwd=root, check=True)
